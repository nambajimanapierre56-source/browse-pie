<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse-Pie</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; background: #1e1e2e; color: white; }
    
    /* Top Tab Bar */
    .tab-bar { display: flex; align-items: center; background: #11111b; padding: 6px 8px 0 8px; gap: 4px; overflow-x: auto; }
    .tab { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #252538; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; max-width: 180px; }
    .tab.active { background: #313244; font-weight: bold; }
    .tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .close-tab { background: none; border: none; color: #aaa; cursor: pointer; font-size: 14px; }
    .close-tab:hover { color: #ff5555; }
    .new-tab-btn { background: #313244; border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 16px; margin-bottom: 4px; }
    .new-tab-btn:hover { background: #45475a; }

    /* Navigation Toolbar */
    .toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #313244; }
    .nav-btn { background: #45475a; border: none; color: white; padding: 7px 12px; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .nav-btn:hover { background: #585b70; }
    .url-box { flex: 1; padding: 8px 14px; border-radius: 20px; border: none; background: #1e1e2e; color: white; font-size: 14px; outline: none; }
    .url-box:focus { box-shadow: 0 0 0 2px #89b4fa; }

    /* Quick Bookmarks Bar */
    .bookmarks { display: flex; gap: 10px; padding: 6px 14px; background: #252538; font-size: 12px; border-bottom: 1px solid #11111b; }
    .bookmark { color: #cdd6f4; text-decoration: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; }
    .bookmark:hover { background: #313244; }

    /* Browser View Area */
    .view-container { flex: 1; position: relative; background: white; }
    iframe { width: 100%; height: 100%; border: none; display: none; }
    iframe.active { display: block; }
  </style>
</head>
<body>

  <!-- Tabs -->
  <div class="tab-bar" id="tabBar">
    <button class="new-tab-btn" onclick="createTab()">+</button>
  </div>

  <!-- Address & Controls -->
  <div class="toolbar">
    <button class="nav-btn" onclick="goBack()" title="Back">←</button>
    <button class="nav-btn" onclick="goForward()" title="Forward">→</button>
    <button class="nav-btn" onclick="reloadTab()" title="Reload">↻</button>
    <button class="nav-btn" onclick="goHome()" title="Home">⌂</button>
    <input type="text" class="url-box" id="urlInput" placeholder="Search with Wikipedia or enter a website URL..." onkeydown="if(event.key==='Enter') navigate()">
    <button class="nav-btn" onclick="navigate()">Go</button>
  </div>

  <!-- Quick Links -->
  <div class="bookmarks">
    <span class="bookmark" onclick="loadUrl('https://wikipedia.org')">Wikipedia</span>
    <span class="bookmark" onclick="loadUrl('https://archive.org')">Internet Archive</span>
    <span class="bookmark" onclick="loadUrl('https://openstreetmap.org')">Maps</span>
    <span class="bookmark" onclick="loadUrl('https://wiby.me')">Wiby Search</span>
  </div>

  <!-- Web Pages Container -->
  <div class="view-container" id="viewContainer"></div>

  <script>
    let tabs = [];
    let activeTabId = null;
    let tabCounter = 0;
    const homeUrl = "https://wikipedia.org";

    function createTab(url = homeUrl) {
      tabCounter++;
      const id = "tab-" + tabCounter;

      const iframe = document.createElement("iframe");
      iframe.id = "frame-" + id;
      iframe.src = url;
      document.getElementById("viewContainer").appendChild(iframe);

      tabs.push({ id, url, title: "Tab " + tabCounter });
      renderTabs();
      switchTab(id);
    }

    function renderTabs() {
      const tabBar = document.getElementById("tabBar");
      const addBtn = tabBar.querySelector(".new-tab-btn");
      tabBar.innerHTML = "";

      tabs.forEach(tab => {
        const tabEl = document.createElement("div");
        tabEl.className = "tab" + (tab.id === activeTabId ? " active" : "");
        tabEl.onclick = () => switchTab(tab.id);

        const titleSpan = document.createElement("span");
        titleSpan.textContent = tab.title;

        const closeBtn = document.createElement("button");
        closeBtn.className = "close-tab";
        closeBtn.textContent = "×";
        closeBtn.onclick = (e) => { e.stopPropagation(); closeTab(tab.id); };

        tabEl.appendChild(titleSpan);
        tabEl.appendChild(closeBtn);
        tabBar.appendChild(tabEl);
      });

      tabBar.appendChild(addBtn);
    }

    function switchTab(id) {
      activeTabId = id;
      tabs.forEach(tab => {
        const frame = document.getElementById("frame-" + tab.id);
        if (tab.id === id) {
          frame.classList.add("active");
          document.getElementById("urlInput").value = tab.url;
        } else {
          frame.classList.remove("active");
        }
      });
      renderTabs();
    }

    function closeTab(id) {
      if (tabs.length === 1) return; // Keep at least 1 tab open
      const index = tabs.findIndex(t => t.id === id);
      document.getElementById("frame-" + id).remove();
      tabs.splice(index, 1);

      if (activeTabId === id) {
        const nextTab = tabs[Math.max(0, index - 1)];
        switchTab(nextTab.id);
      } else {
        renderTabs();
      }
    }

    function navigate() {
      let input = document.getElementById("urlInput").value.trim();
      if (!input) return;

      let finalUrl = "";
      // Check if user typed a website URL or a search term
      if (input.includes(".") && !input.includes(" ")) {
        finalUrl = input.startsWith("http://") || input.startsWith("https://") ? input : "https://" + input;
      } else {
        // Search using Wikipedia if they typed words instead of a link
        finalUrl = "https://wikipedia.org" + encodeURIComponent(input);
      }
      loadUrl(finalUrl);
    }

    function loadUrl(url) {
      const currentTab = tabs.find(t => t.id === activeTabId);
      if (!currentTab) return;

      currentTab.url = url;
      try {
        currentTab.title = new URL(url).hostname.replace("www.", "");
      } catch {
        currentTab.title = "Search";
      }

      document.getElementById("urlInput").value = url;
      document.getElementById("frame-" + activeTabId).src = url;
      renderTabs();
    }

    function reloadTab() {
      const frame = document.getElementById("frame-" + activeTabId);
      if (frame) frame.src = frame.src;
    }

    function goHome() { loadUrl(homeUrl); }
    function goBack() { window.history.back(); }
    function goForward() { window.history.forward(); }

    // Open first tab automatically
    createTab();
  </script>
</body>
</html>
